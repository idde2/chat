version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: eddi_chat_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chat
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: eddi_chat_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=chatuser
      - MYSQL_PASSWORD=chatpassword
      - MYSQL_DB=chat
      - JWT_SECRET=EDD1_CH4T_JWT_S3CR3T_K3Y_CH4NG3_M3!
    depends_on:
      - db

volumes:
  db_data:
