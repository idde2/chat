<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/chat/static/css/login.css?v=2">
    <link rel="stylesheet" href="/chat/static/css/main.css?v=2">

</head>

<body>
<div onclick="window.location.href = '/chat'" class="back-icon">
    <i class="fa-solid fa-arrow-left"></i>
</div>

<div class="bg-overlay"></div>
<div class="main-container">
    <div class="auth-card">


        <form method="POST">
            <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-wrapper">
                <i class="fa-solid fa-shield-halved"></i>
                <input type="password" name="password" placeholder="********" maxlength="16" required>
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>

        <div onclick="window.location.href='/chat/register'" class="register-link" >
            You don't have an account?
       </div>
    </div>
</div>

</body>
</html>
