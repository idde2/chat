<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chats</title>
    <link rel="stylesheet" href="/chat/static/css/index.css?v=3">
    <link rel="stylesheet" href="/chat/static/css/main.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body data-user="{{ session.get('user') }}">

    <div class="top-actions">
        <div onclick="window.location.href = '/chat/kontakt' " class="add-user">
            <i class="fa-solid fa-user"></i>
            <p>neuer kontakt</p>
        </div>

        <div onclick="openGroupModal()" class="add-user">
            <i class="fa-solid fa-users"></i>
            <p>neue gruppe</p>
        </div>
    </div>

    <div class="container">
        {% for contact in kontacts %}
        <div onclick="window.location.href='/chat/chat/{{ contact }}'" style="cursor: pointer;" class="contact"
            data-name="{{ contact }}">
            <img src="/chat/static/img/profil/{{ contact }}.png" height="50" width="50" alt="{{ contact }}">
            <span>{{ contact }}</span>
            <span class="online-indicator" id="online-{{ contact }}"></span>
        </div>
        {% endfor %}

        {% if groups %}
        <h3 style="color: #fff; margin: 20px 0 10px 0; font-size: 1.1rem;">Gruppen</h3>
        {% for group in groups %}
        <div onclick="window.location.href='/chat/group/{{ group.id }}'" style="cursor: pointer;" class="contact"
            data-name="{{ group.name }}">
            <div
                style="width: 50px; height: 50px; border-radius: 50%; background: #6366f1; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;">
                <i class="fa-solid fa-users"></i>
            </div>
            <span>{{ group.name }}</span>
        </div>
        {% endfor %}
        {% endif %}
    </div>

    <!-- Modal: Gruppe erstellen -->
    <div id="groupModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-users-gear"></i> Neue Gruppe erstellen</h3>
                <button class="close-btn" onclick="closeGroupModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label for="groupNameInput">Gruppenname</label>
                <input type="text" id="groupNameInput" class="form-input" placeholder="Z.B. Projekt Team">

                <label style="margin-top: 10px; display: block;">Mitglieder auswählen</label>
                <div class="members-select-list" id="membersSelectList">
                    <p class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Lade Kontakte...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGroupModal()">Abbrechen</button>
                <button class="btn btn-primary" onclick="submitCreateGroup()">Erstellen</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/chat/static/js/index.js?v=1"></script>
</body>

</html>
