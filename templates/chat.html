<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="/chat/static/css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/chat/static/css/main.css">

</head>
<body data-receiver="{{ receiver }}" data-user="{{ user }}">
<div class="header">
    <div onclick="window.location.href = '/chat'" class="back-icon">
        <i class="fa-solid fa-arrow-left"></i>
    </div>
    <div class="user-info">
        <img src="/chat/static/img/profil/{{ receiver_name }}.png" height="25" width="25"  alt="">
        <span >{{ receiver_name }}</span>
    </div>
    <div class="icons">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
</div>
<div class="container">
    {% for message in msg %}
        {% if message[0] == user %}
            <div class="message-wrapper du">
                <p>{{ message[1] }}</p>
                <p data-time="{{ message[2]}}" class="time"></p>
            </div>

        {% endif %}

        {% if message[0] == receiver %}
            <div class="message-wrapper fremd">
                <p>{{ message[1] }}</p>
                <p data-time="{{ message[2]}}" class="time"></p>
            </div>
        {% endif %}
    {% endfor %}
    <div style="height: 100px; flex-shrink: 0;"></div>
</div>

<form class="input" action="/chat/msg/{{ receiver }}" method="post">
    <input type="text" autocomplete="off" name="msg" placeholder="Nachricht" required>

    <button type="submit" class="submit-btn">
        <i class="fa-solid fa-paper-plane"></i>
    </button>
</form>

<script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
<script src="/chat/static/js/chat.js"> </script>
</body>
</html>
